
version: "3.9"

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: mongosh --eval "db.runCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval
      "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})"
      || true

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/shopverse?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      SEED_ON_START: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
    ports: ["5000:5000"]

  client:
    build: ./client
    depends_on: [server]
    ports: ["5173:80"]

volumes:
  mongo_data:
